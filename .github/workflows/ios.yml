name: iOS — Build unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/source-bundle/**'
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - '.github/source-bundle/**'
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carbyne-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Compile SwiftUI app and package unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble and extract project sources
        run: |
          cat .github/source-bundle/part-*.b64 | base64 --decode > "$RUNNER_TEMP/carbyne-project-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/carbyne-project-source.tar.gz" -C .
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/Carbyne
        run: xcodegen generate
      - name: Resolve Swift packages
        working-directory: ios/Carbyne
        run: xcodebuild -resolvePackageDependencies -project Carbyne.xcodeproj -scheme Carbyne
      - name: Compile for generic iOS device (unsigned)
        working-directory: ios/Carbyne
        run: |
          xcodebuild \
            -project Carbyne.xcodeproj \
            -scheme Carbyne \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CarbyneDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/CarbyneDerivedData/Build/Products/Release-iphoneos/Carbyne.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/Carbyne.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Carbyne-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Carbyne-unsigned.ipa"
          unzip -t "$GITHUB_WORKSPACE/Carbyne-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Carbyne-unsigned-IPA
          path: Carbyne-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
