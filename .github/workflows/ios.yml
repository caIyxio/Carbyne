name: iOS — Build unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/source-bundle/**'
      - '.github/scripts/**'
      - '.github/assets/**'
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - '.github/source-bundle/**'
      - '.github/scripts/**'
      - '.github/assets/**'
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carbyne-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Compile SwiftUI app and package unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble and extract project sources
        run: |
          cat .github/source-bundle/part-*.b64 | base64 --decode > "$RUNNER_TEMP/carbyne-project-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/carbyne-project-source.tar.gz" -C .
      - name: Apply adaptive Liquid Glass SwiftUI interface
        run: python3 .github/scripts/apply-liquid-glass-ui.py
      - name: Rebuild native Liquid Glass navigation and profile UI
        run: python3 .github/scripts/repair-ios-interface.py
      - name: Use unique UIKit tab controllers to prevent controller-sharing crash
        run: python3 .github/scripts/replace-tabview-with-distinct-controllers.py
      - name: Fix scrolling Home header and compact edge-to-edge profile layout
        run: python3 .github/scripts/fix-home-header-profile-layout.py
      - name: Separate own Profile from public Channels and use account avatar in tab bar
        run: python3 .github/scripts/fix-profile-channel-nav-avatar.py
      - name: Push Search in existing navigation and repair public profile layout
        run: python3 .github/scripts/fix-search-push-navigation-and-public-profile.py
      - name: Fix Home Search action scope and align public profile Subscribe button
        run: python3 .github/scripts/fix-profile-header-and-search-scope.py
      - name: Extend public profile banner behind the status bar
        run: python3 .github/scripts/extend-public-profile-banner-under-status-bar.py
      - name: Add animated subscription feedback and haptics
        run: python3 .github/scripts/add-subscription-feedback.py
      - name: Add stretchy profile banners and account switching
        run: python3 .github/scripts/add-profile-stretch-and-account-switcher.py
      - name: Add native Settings and Privacy navigation
        run: python3 .github/scripts/add-settings-privacy-navigation.py
      - name: Add messaging, profile crop editor, bios and tab avatar polish
        run: python3 .github/scripts/add-messaging-profile-crop-bio.py
      - name: Add Edit Profile navigation and leave Upload empty
        run: python3 .github/scripts/add-edit-profile-and-empty-upload.py
      - name: Improve chat media and message notifications
        run: python3 .github/scripts/repair-messaging-notifications.py
      - name: Add chat media previews, voice transcription and account loading
        run: python3 .github/scripts/add-chat-media-waveforms-transcription-and-account-loading.py
      - name: Cache chat photos, preserve aspect ratio and retry speech interruptions
        run: python3 .github/scripts/fix-chat-attachment-cache-aspect-and-transcription.py
      - name: Avoid incompatible local speech assets and use paper airplane send icon
        run: python3 .github/scripts/fix-speech-recognition-model-fallback-and-paperplane.py
      - name: Put paper airplane on the Chat navigation tab
        run: python3 .github/scripts/fix-chat-tab-paperplane-icon.py
      - name: Fix custom profile images and speed up image and data loading
        run: python3 .github/scripts/fix-profile-images-and-app-loading.py
      - name: Fix zoomed and dragged profile crops and enlarge navigation avatar
        run: python3 .github/scripts/fix-manual-profile-crop-and-tab-avatar.py
      - name: Fix crop output and adapt status bar contrast to background
        run: python3 .github/scripts/fix-crop-render-and-adaptive-status-bar.py
      - name: Fix black crop exports using materialized CGImage rendering
        run: python3 .github/scripts/fix-profile-crop-black-render.py
      - name: Fix false blank detection for transparent crop corners
        run: python3 .github/scripts/fix-transparent-crop-corner-validation.py
      - name: Crop source pixels using the exact dragged viewport
        run: python3 .github/scripts/fix-dragged-crop-source-rect.py
      - name: Keep crop preview and export transforms identical
        run: python3 .github/scripts/fix-profile-crop-preview-transform.py
      - name: Prevent black profile photos by rendering decoded source pixels directly
        run: python3 .github/scripts/fix-black-profile-photo-export.py
      - name: Crop profile images in Core Image source pixels and encode without redraw
        run: python3 .github/scripts/fix-profile-crop-ci-pixels.py
      - name: Define the banner scroll coordinate space in Edit Profile
        run: python3 .github/scripts/fix-edit-profile-banner-coordinate-space.py
      - name: Use the same zoomed and dragged viewport for crop preview and export
        run: python3 .github/scripts/fix-profile-crop-shared-transform.py
      - name: Add About, dark mode, private development notice and refreshed navigation
        run: python3 .github/scripts/add-about-dark-mode-and-development-notice.py
      - name: Apply Instagram-inspired profile layout and charcoal appearance
        run: python3 .github/scripts/redesign-instagram-profile-and-dark-palette.py
      - name: Fix profile counts, username availability, sharing, and Chat routing
        run: python3 .github/scripts/fix-profile-counts-username-sharing-and-chat-routing.py
      - name: Shorten profile banners and improve username spacing
        run: python3 .github/scripts/refine-profile-banner-height-and-identity-spacing.py
      - name: Preserve extracted SwiftUI source for implementation review
        run: tar -czf "$RUNNER_TEMP/carbyne-ios-source.tar.gz" ios/Carbyne
      - name: Upload extracted SwiftUI source
        uses: actions/upload-artifact@v4
        with:
          name: Carbyne-iOS-source-snapshot
          path: ${{ runner.temp }}/carbyne-ios-source.tar.gz
          retention-days: 2
      - name: Install Carbyne app icon
        run: |
          set -euo pipefail
          PROJECT_YML="$(find ios/Carbyne -maxdepth 3 -name project.yml -print -quit)"
          test -n "$PROJECT_YML"
          SOURCE_DIR="$(find ios/Carbyne -maxdepth 3 -type d -name Sources -print -quit)"
          if [ -z "$SOURCE_DIR" ]; then SOURCE_DIR="$(dirname "$PROJECT_YML")"; fi
          ASSET_DIR="$SOURCE_DIR/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ASSET_DIR"
          base64 -D -i .github/assets/carbyne-app-icon.png.b64 -o "$RUNNER_TEMP/CarbyneIcon256.png"
          sips -s format png -z 1024 1024 "$RUNNER_TEMP/CarbyneIcon256.png" --out "$ASSET_DIR/CarbyneAppIcon.png" >/dev/null
          cat > "$ASSET_DIR/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "CarbyneAppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON
          python3 - "$PROJECT_YML" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text()
          if "ASSETCATALOG_COMPILER_APPICON_NAME" not in text:
              text = "settings:\n  base:\n    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon\n\n" + text
              p.write_text(text)
          print("Carbyne app icon asset catalog installed.")
          PY
      - name: Set app version and monotonic build number
        run: python3 .github/scripts/set-app-version.py
      - name: Apply Supabase Swift SDK storage compatibility patch
        run: python3 .github/scripts/patch-supabase-storage-api.py
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/Carbyne
        run: xcodegen generate
      - name: Resolve Swift packages
        working-directory: ios/Carbyne
        run: xcodebuild -resolvePackageDependencies -project Carbyne.xcodeproj -scheme Carbyne
      - name: Compile for generic iOS device (unsigned)
        working-directory: ios/Carbyne
        run: |
          xcodebuild \
            -project Carbyne.xcodeproj \
            -scheme Carbyne \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CarbyneDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Stamp app version and serial into Info.plist
        run: python3 .github/scripts/stamp-built-app-metadata.py "$RUNNER_TEMP/CarbyneDerivedData/Build/Products/Release-iphoneos/Carbyne.app"
      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/CarbyneDerivedData/Build/Products/Release-iphoneos/Carbyne.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/Carbyne.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Carbyne-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Carbyne-unsigned.ipa"
          unzip -t "$GITHUB_WORKSPACE/Carbyne-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Carbyne-unsigned-IPA
          path: Carbyne-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

