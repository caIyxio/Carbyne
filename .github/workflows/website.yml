name: Website — GitHub build and Netlify deploy
# Netlify deployment workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/source-bundle/**'
      - 'site/**'
      - 'scripts/**'
      - 'maintenance/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - '.github/source-bundle/**'
      - 'site/**'
      - 'scripts/**'
      - 'maintenance/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carbyne-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble and extract project sources
        run: |
          cat .github/source-bundle/part-*.b64 | base64 --decode > "$RUNNER_TEMP/carbyne-project-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/carbyne-project-source.tar.gz" -C .
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate website source
        run: npm run validate
      - name: Build static site on GitHub Actions
        run: npm run build
      - name: Publish maintenance landing page
        run: cp maintenance/index.html dist/index.html
      - name: Upload prebuilt site
        uses: actions/upload-artifact@v4
        with:
          name: carbyne-website-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy prebuilt files to Netlify production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download prebuilt site
        uses: actions/download-artifact@v4
        with:
          name: carbyne-website-dist
          path: dist
      - name: Check deployment secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'Missing NETLIFY_AUTH_TOKEN repository/environment secret.'; exit 1; }
      - name: Diagnose Netlify site access
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/netlify-site-check.json" -w "%{http_code}" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Accept: application/json" \
            "https://api.netlify.com/api/v1/sites/c7fad918-3ed1-43bc-81e4-8254de97bd87")
          echo "Netlify site API status: $status"
          if [ "$status" = "200" ]; then
            echo "Token can read the target site."
          else
            echo "Token cannot read the target site. Response:"
            cat "$RUNNER_TEMP/netlify-site-check.json"
            exit 1
          fi
      - name: Deploy already-built output (no Netlify build)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --prod \
            --site="c7fad918-3ed1-43bc-81e4-8254de97bd87" \
            --message="GitHub Actions ${GITHUB_SHA}"
