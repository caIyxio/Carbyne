name: Diagnose Carbyne profile image pixels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-profile-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-profile-images:
    runs-on: macos-26
    steps:
      - name: Test production image decode and rendering paths in an iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vezpcrvdswyvcwdzyxnr.supabase.co/storage/v1/object/public/avatars/db2ff8ff-242b-4774-a0b3-13faeddcf583"
          ROOT="$RUNNER_TEMP/ImageRenderProbe"
          mkdir -p "$ROOT/Resources" "$ROOT/Sources"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/avatar-050d097e-a513-4792-b7b2-8247cf0bc51d.jpg" -o "$ROOT/Resources/avatar.jpg"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/banner-197aaa01-4554-4b47-82bb-c5587b3db784.jpg" -o "$ROOT/Resources/banner.jpg"
          cat > "$ROOT/project.yml" <<'YAML'
          name: ImageRenderProbe
          options:
            bundleIdPrefix: com.carbyne
            deploymentTarget:
              iOS: "17.0"
          targets:
            ImageRenderProbe:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.carbyne.ImageRenderProbe
                  GENERATE_INFOPLIST_FILE: YES
                  SWIFT_VERSION: "6.0"
          YAML
          cat > "$ROOT/Sources/ImageRenderProbeApp.swift" <<'SWIFT'
          import SwiftUI

          @main
          struct ImageRenderProbeApp: App {
              var body: some Scene {
                  WindowGroup { ProbeView() }
              }
          }
          SWIFT
          cat > "$ROOT/Sources/ProbeView.swift" <<'SWIFT'
          import SwiftUI
          import UIKit
          import ImageIO
          import CoreImage

          struct ProbeView: View {
              @State private var status = "Inspecting"
              var body: some View {
                  VStack(spacing: 8) {
                      Text("Profile image rendering probe")
                      Text(status)
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(.white)
                  .task { await runProbe() }
              }

              private func imageData(named name: String) -> Data? {
                  guard let url = Bundle.main.url(forResource: name, withExtension: "jpg")
                      ?? Bundle.main.url(forResource: name, withExtension: "jpg", subdirectory: "Resources") else { return nil }
                  return try? Data(contentsOf: url)
              }

              private func directUIImage(named name: String) -> UIImage? {
                  guard let data = imageData(named: name) else { return nil }
                  return UIImage(data: data)
              }

              private func imageIOThumbnail(named name: String, cacheImmediately: Bool) -> UIImage? {
                  guard let data = imageData(named: name),
                        let source = CGImageSourceCreateWithData(data as CFData, nil) else { return nil }
                  let options: [CFString: Any] = [
                      kCGImageSourceCreateThumbnailFromImageAlways: true,
                      kCGImageSourceCreateThumbnailWithTransform: true,
                      kCGImageSourceThumbnailMaxPixelSize: 1400,
                      kCGImageSourceShouldCache: true,
                      kCGImageSourceShouldCacheImmediately: cacheImmediately
                  ]
                  guard let cg = CGImageSourceCreateThumbnailAtIndex(source, 0, options as CFDictionary) else { return nil }
                  return UIImage(cgImage: cg, scale: 1, orientation: .up)
              }

              private func coreImageDecode(named name: String) -> UIImage? {
                  guard let data = imageData(named: name),
                        let image = CIImage(data: data),
                        let space = CGColorSpace(name: CGColorSpace.sRGB),
                        let cg = CIContext(options: [.outputColorSpace: space]).createCGImage(image, from: image.extent) else { return nil }
                  return UIImage(cgImage: cg, scale: 1, orientation: .up)
              }

              @MainActor
              private func pixelSummary(_ cg: CGImage) -> String {
                  let width = cg.width
                  let height = cg.height
                  let count = width * height
                  var buffer = [UInt8](repeating: 0, count: count * 4)
                  buffer.withUnsafeMutableBytes { raw in
                      let context = CGContext(
                          data: raw.baseAddress,
                          width: width,
                          height: height,
                          bitsPerComponent: 8,
                          bytesPerRow: width * 4,
                          space: CGColorSpaceCreateDeviceRGB(),
                          bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue
                      )!
                      context.draw(cg, in: CGRect(x: 0, y: 0, width: width, height: height))
                  }
                  var sum = 0.0
                  var black = 0
                  for index in stride(from: 0, to: buffer.count, by: 4) {
                      let y = 0.2126 * Double(buffer[index])
                          + 0.7152 * Double(buffer[index + 1])
                          + 0.0722 * Double(buffer[index + 2])
                      sum += y
                      if y < 8 { black += 1 }
                  }
                  return "\(width)x\(height) avg=\(String(format: "%.2f", sum / Double(count))) black=\(String(format: "%.2f", 100 * Double(black) / Double(count)))%"
              }

              @MainActor
              private func inspect(_ label: String, _ image: UIImage, size: CGSize, lines: inout [String]) {
                  guard let cg = image.cgImage else {
                      lines.append("\(label): UIImage.CGImage is nil")
                      return
                  }
                  lines.append("\(label) CGImage: \(pixelSummary(cg)) colorSpace=\(cg.colorSpace?.name.map { $0 as String } ?? "nil")")
                  let renderer = UIGraphicsImageRenderer(size: size)
                  let drawn = renderer.image { _ in image.draw(in: CGRect(origin: .zero, size: size)) }
                  if let output = drawn.cgImage {
                      lines.append("\(label) UIKit draw: \(pixelSummary(output))")
                  } else {
                      lines.append("\(label) UIKit draw: no CGImage")
                  }

                  let view = Image(uiImage: image)
                      .resizable()
                      .scaledToFill()
                      .frame(width: size.width, height: size.height)
                      .clipped()
                      .background(Color.white)
                  let swiftRenderer = ImageRenderer(content: view)
                  swiftRenderer.proposedSize = ProposedViewSize(width: size.width, height: size.height)
                  swiftRenderer.scale = 1
                  if let output = swiftRenderer.uiImage?.cgImage {
                      lines.append("\(label) SwiftUI ImageRenderer: \(pixelSummary(output))")
                  } else {
                      lines.append("\(label) SwiftUI ImageRenderer: FAILED")
                  }
              }

              @MainActor
              private func circularAvatar(_ image: UIImage) -> UIImage {
                  let size = CGSize(width: 34, height: 34)
                  return UIGraphicsImageRenderer(size: size).image { context in
                      let rect = CGRect(origin: .zero, size: size)
                      UIBezierPath(ovalIn: rect.insetBy(dx: 1, dy: 1)).addClip()
                      image.draw(in: rect)
                      context.cgContext.setStrokeColor(UIColor.white.withAlphaComponent(0.9).cgColor)
                      context.cgContext.setLineWidth(2)
                      context.cgContext.strokeEllipse(in: rect.insetBy(dx: 1, dy: 1))
                  }.withRenderingMode(.alwaysOriginal)
              }

              @MainActor
              private func runProbe() async {
                  var lines: [String] = []
                  for name in ["avatar", "banner"] {
                      let size = name == "avatar" ? CGSize(width: 200, height: 200) : CGSize(width: 360, height: 120)
                      if let direct = directUIImage(named: name) {
                          inspect("\(name) UIImage(data:) after loader returned", direct, size: size, lines: &lines)
                          let icon = circularAvatar(direct)
                          inspect("\(name) tab-bar circular renderer", icon, size: CGSize(width: 34, height: 34), lines: &lines)
                          if let prepared = await direct.byPreparingForDisplay() {
                              inspect("\(name) UIImage.byPreparingForDisplay()", prepared, size: size, lines: &lines)
                          } else {
                              lines.append("\(name) UIImage.byPreparingForDisplay(): nil")
                          }
                      } else {
                          lines.append("\(name) UIImage(data:): FAILED")
                      }

                      if let lazy = imageIOThumbnail(named: name, cacheImmediately: false) {
                          inspect("\(name) ImageIO thumbnail (lazy) after source/data released", lazy, size: size, lines: &lines)
                      } else {
                          lines.append("\(name) ImageIO lazy thumbnail: FAILED")
                      }
                      if let eager = imageIOThumbnail(named: name, cacheImmediately: true) {
                          inspect("\(name) ImageIO thumbnail (cacheImmediately) after source/data released", eager, size: size, lines: &lines)
                      } else {
                          lines.append("\(name) ImageIO eager thumbnail: FAILED")
                      }
                      if let ci = coreImageDecode(named: name) {
                          inspect("\(name) Core Image sRGB materialized", ci, size: size, lines: &lines)
                      } else {
                          lines.append("\(name) Core Image decode: FAILED")
                      }
                  }

                  let report = lines.joined(separator: "\n")
                  let destination = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent("report.txt")
                  try? report.write(to: destination, atomically: true, encoding: .utf8)
                  status = "Report written"
                  print(report)
              }
          }
          SWIFT
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          cd "$ROOT"
          xcodegen generate
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -quiet -project ImageRenderProbe.xcodeproj -scheme ImageRenderProbe -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/ImageRenderProbeDerived" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/ImageRenderProbeDerived/Build/Products/Debug-iphonesimulator/ImageRenderProbe.app"
          cp "$ROOT/Resources/avatar.jpg" "$APP/avatar.jpg"
          cp "$ROOT/Resources/banner.jpg" "$APP/banner.jpg"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.carbyne.ImageRenderProbe
          sleep 5
          APP_DATA="$(xcrun simctl get_app_container "$UDID" com.carbyne.ImageRenderProbe data)"
          echo "=== iOS Simulator UIImage / ImageIO / CoreImage / SwiftUI report ==="
          cat "$APP_DATA/Documents/report.txt"
