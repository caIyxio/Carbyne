<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071f49">
  <meta name="description" content="Carbyne is temporarily under maintenance. We'll be back soon.">
  <title>Carbyne — Back soon</title>
  <style>
    :root { color-scheme: dark; --navy:#06234f; --ink:#f7f8ff; --muted:#d8e2f5; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      min-height:100svh; overflow-x:hidden; background:#d9eafa; color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .mosaic {
      position:relative; width:100%; height:100dvh; min-height:100svh; display:grid; grid-template-columns:repeat(12,1fr);
      grid-template-rows:minmax(250px,46svh) minmax(250px,54svh); gap:0; overflow:hidden;
      background:#b7dafa;
    }
    .panel { position:relative; overflow:hidden; isolation:isolate; }
    .top-a { grid-column:1/3; grid-row:1; background:linear-gradient(145deg,#1b9bd0,#5f55b6 70%,#a04c9b); }
    .top-b { grid-column:3/8; grid-row:1; background:#dff3ff; }
    .top-c { grid-column:8/13; grid-row:1; background:linear-gradient(130deg,#08a9d3,#36c5e8); }
    .bottom-a { grid-column:1/4; grid-row:2; background:#65c8f4; }
    .bottom-b { grid-column:4/13; grid-row:2; background:#7867bd; }
    /* Segmented apple emblems inspired by the reference artwork. */
    .panel { display:grid; place-items:center; }
    .apple-art { width:min(78%,390px); height:88%; overflow:visible; filter:drop-shadow(0 18px 24px #10245a30); }
    .top-a { background:#7969bc; }
    .top-b { background:#e1f4ff; }
    .top-c { background:#18acd9; }
    .bottom-a { background:#65c8f4; }
    .bottom-b { background:#7969bc; }
    .top-a .apple-art { width:min(94%,430px); }
    .top-c .apple-art { width:min(92%,430px); }
    .bottom-b .apple-art { width:min(50%,330px); }
    .apple-art .cut { fill:none; stroke:#f7fbff; stroke-width:3.2; stroke-linecap:round; }
    .apple-art .leaf { fill:#168fe0; }
    .apple-art .base-a { fill:#168fe0; }
    .apple-art .base-b { fill:#6249bb; }
    .apple-art .stripe { fill:url(#blueStripes); }
    .apple-art .dots { fill:url(#purpleDots); }
    .apple-art .stripe2 { fill:url(#purpleStripes); }
    .apple-art .dots2 { fill:url(#blueDots); }
    .top-a .apple-art { transform:rotate(-8deg) scale(1.12); }
    .top-c .apple-art { transform:rotate(8deg) scale(1.08); }
    .bottom-a .apple-art { transform:rotate(-7deg) scale(1.12); }
    .bottom-b .apple-art { transform:rotate(5deg) scale(1.2); }
    .hero {
      position:absolute;z-index:5;left:0;right:0;top:50%;min-height:0;transform:translateY(-50%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
      padding:clamp(28px,6vw,72px) 24px;background:var(--navy);box-shadow:0 22px 70px #001a3a30;
    }
    .brand-logo { display:block;width:min(30vw,190px);height:auto;margin:0 auto 22px; }
    h1 { margin:0;font-size:clamp(38px,4.2vw,58px);line-height:1.08;letter-spacing:-.055em;font-weight:650; }
    .copy { max-width:560px;margin:13px 0 0;color:#d8e2f5;font-size:clamp(15px,1.7vw,20px);line-height:1.5; }
    .footer { position:absolute;z-index:6;left:28px;right:28px;bottom:17px;display:flex;justify-content:space-between;
      color:#ffffffad;font-size:11px;letter-spacing:.04em;pointer-events:none; }
    @media(max-width:700px) {
      .mosaic { grid-template-rows:35svh 65svh; }
      .top-a { grid-column:1/4; }
      .top-b { grid-column:4/9; }
      .top-c { grid-column:9/13; }
      .bottom-a { grid-column:1/5; }
      .bottom-b { grid-column:5/13; }
      .hero { left:0;right:0;top:50%;min-height:0;padding:38px 24px; }
      .brand-logo { width:min(42vw,160px);margin-bottom:20px; }
      h1 { font-size:clamp(36px,9vw,48px); }
      .copy { max-width:340px;font-size:15px; }
      .eyebrow { font-size:9px; }
      .top-b:before { width:42vw; }
      .footer { left:16px;right:16px;bottom:12px;font-size:10px; }
    }

    /* Pattern artwork: reuse the reference's stripes, halftone dots and split fields,
       without reproducing the Apple silhouette or placing a logo in the panels. */
    .panel { display:block; }
    .pattern-art { position:absolute; inset:0; width:100%; height:100%; }
    .top-a-pattern {
      background:
        radial-gradient(ellipse at 12% 12%, transparent 0 24%, #c5eaff 24.2% 25%, transparent 25.2%),
        repeating-linear-gradient(132deg, #d9f1ff 0 8px, #168fe0 8px 12px, #7969bc 12px 23px);
      clip-path: polygon(0 0,100% 0,100% 100%,0 100%);
    }
    .top-a-pattern:after {
      content:""; position:absolute; width:62%; aspect-ratio:1; right:-12%; bottom:-36%;
      border-radius:50%; background:radial-gradient(circle, #5a3cb6 0 3px, transparent 3.5px) 0 0/15px 15px, #dff3ff;
      box-shadow:0 0 0 18px #7969bc, 0 0 0 21px #e7f5ff;
    }
    .top-b-pattern {
      background:
        radial-gradient(ellipse at 50% 50%, transparent 0 31%, #168fe0 31.2% 31.8%, transparent 32% 39%, #6249bb 39.2% 40%, transparent 40.2%),
        radial-gradient(circle, #168fe0 0 2.2px, transparent 2.7px) 0 0/13px 13px,
        #e1f4ff;
    }
    .top-b-pattern:after {
      content:""; position:absolute; width:56%; height:145%; right:-5%; top:-22%; border-radius:50%;
      border:24px solid #b8e4ff; box-shadow:inset 0 0 0 12px #e1f4ff, inset 0 0 0 20px #6249bb;
      transform:rotate(24deg);
    }
    .top-c-pattern {
      background:
        repeating-linear-gradient(45deg, transparent 0 15px, #e0f5ff 15px 20px, transparent 20px 34px),
        linear-gradient(135deg,#18acd9,#168fe0 55%,#7969bc);
    }
    .top-c-pattern:after {
      content:""; position:absolute; width:68%; aspect-ratio:1; left:-12%; top:-42%; border-radius:50%;
      background:radial-gradient(circle,#6249bb 0 2.6px,transparent 3px) 0 0/14px 14px;
      border:18px solid #bcecff; box-shadow:0 0 0 14px #18acd9;
    }
    .bottom-a-pattern {
      background:
        radial-gradient(circle at 50% 50%, transparent 0 22%, #e2f6ff 22.3% 23.4%, transparent 23.7% 34%, #168fe0 34.3% 35.5%, transparent 35.8%),
        radial-gradient(circle,#6249bb 0 2.8px,transparent 3.2px) 0 0/16px 16px,
        #65c8f4;
    }
    .bottom-b-pattern {
      background:
        repeating-linear-gradient(135deg,#b6dfff 0 7px,#6249bb 7px 12px,#7969bc 12px 23px);
    }
    .bottom-b-pattern:before {
      content:""; position:absolute; width:58%; height:180%; left:22%; top:-40%; border-radius:50%;
      background:radial-gradient(circle,#168fe0 0 2.8px,transparent 3.2px) 0 0/15px 15px,#dff3ff;
      border:20px solid #7969bc; box-shadow:0 0 0 14px #b6dfff;
      transform:rotate(-22deg);
    }
    .bottom-b-pattern:after {
      content:""; position:absolute; inset:0 0 0 68%;
      background:radial-gradient(circle,#583cb5 0 2.4px,transparent 2.8px) 0 0/13px 13px;
      opacity:.9;
    }
    @media(max-width:700px) {
      .top-b-pattern:after { width:70%; right:-22%; }
      .bottom-b-pattern:before { left:5%; width:72%; }
    }

    @media(prefers-reduced-motion:no-preference) {
      .top-a:after { animation:drift 10s ease-in-out infinite alternate; }
      @keyframes drift { to { transform:translate(-9px,-12px); } }
    }
  </style>
</head>
<body>
  <main class="mosaic" aria-label="Carbyne maintenance page">
    <div class="panel top-a" aria-hidden="true"><div class="pattern-art top-a-pattern" aria-hidden="true"></div></div>
    <div class="panel top-b" aria-hidden="true"><div class="pattern-art top-b-pattern" aria-hidden="true"></div></div>
    <div class="panel top-c" aria-hidden="true"><div class="pattern-art top-c-pattern" aria-hidden="true"></div></div>
    <div class="panel bottom-a" aria-hidden="true"><div class="pattern-art bottom-a-pattern" aria-hidden="true"></div></div>
    <div class="panel bottom-b" aria-hidden="true"><div class="pattern-art bottom-b-pattern" aria-hidden="true"></div></div>
    <section class="hero" aria-labelledby="maintenance-title">
      <img class="brand-logo" src="./carbyne-wordmark.svg" alt="Carbyne">
      <h1 id="maintenance-title">A short pause. Back soon.</h1>
      <p class="copy">We’re making a few improvements behind the scenes. Carbyne will be back as soon as the work is complete.</p>
    </section>
    <footer class="footer"><span>© <span id="year"></span> Carbyne</span><span>Built for what’s next.</span></footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
